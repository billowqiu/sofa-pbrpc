syntax = "proto3";
package sofa.pbrpc;

message RpcTelemetry {
    uint64 trace_high_id = 1;
    uint64 trace_low_id = 2;
    uint64 span_id = 3;
    uint64 parent_id = 4;
    int32  flags = 5;
    map<string, string> baggage = 6;
    string debug_id = 7;
    // uint64_t _spanID;
    // uint64_t _parentID;
    // unsigned char _flags;
    // StrMap _baggage;
    // std::string _debugID;
    // mutable std::mutex _mutex;  // Protects _baggage.
}
